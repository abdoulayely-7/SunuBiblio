spring.application.name=SunuBiblio

# Valeurs lues dans le fichier .env local (non commite, voir .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SunuBiblio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Chaque module possede son propre script : db/schema-<module>.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/schema-*.sql
