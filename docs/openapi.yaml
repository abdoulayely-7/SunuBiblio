openapi: 3.1.0
info:
  title: SunuBiblio
  description: "Prêts de la bibliothèque universitaire : livres et exemplaires, adhé\
    rents, emprunts, retours et pénalités de retard. Toutes les erreurs suivent le\
    \ format Problem Details (RFC 9457), avec un message en français explicite."
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Serveur local
tags:
- name: Catalogue
  description: "Livres et exemplaires (F1, F2, F4)"
- name: Adhérents
  description: Inscription des étudiants et des enseignants (F3)
- name: Emprunts
  description: "Prêts, retours et situation d'un adhérent (F5, F6, F7, F9)"
- name: Pénalités
  description: Paiement des pénalités de retard (F8)
paths:
  /penalites/{penaliteId}/paiement:
    post:
      tags:
      - Pénalités
      summary: Payer une pénalité (F8)
      description: "Une fois toutes ses pénalités payées, l'adhérent peut de nouveau\
        \ emprunter."
      operationId: payer
      parameters:
      - name: penaliteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Pénalité payée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PenaliteDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /livres:
    get:
      tags:
      - Catalogue
      summary: Rechercher un livre et voir les exemplaires disponibles (F4)
      operationId: rechercher
      parameters:
      - name: q
        in: query
        description: "Texte cherché dans le titre ou l'auteur, sans tenir compte des\
          \ majuscules"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Les livres dont le titre ou l'auteur contient le texte (tous
            sans texte)
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LivreDto"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
    post:
      tags:
      - Catalogue
      summary: Ajouter un livre et ses exemplaires (F1)
      operationId: ajouterLivre
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjouterLivreRequest"
        required: true
      responses:
        "201":
          description: "Livre créé, tous ses exemplaires sont disponibles"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LivreDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /livres/{livreId}/exemplaires:
    post:
      tags:
      - Catalogue
      summary: Ajouter un exemplaire à un livre existant (F1)
      operationId: ajouterExemplaire
      parameters:
      - name: livreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: "Exemplaire créé, disponible"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExemplaireDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /emprunts:
    post:
      tags:
      - Emprunts
      summary: Emprunter un exemplaire (F5)
      description: "Le prêt dure 14 jours. Refusé si l'adhérent a atteint son quota,\
        \ s'il a une pénalité impayée ou si l'exemplaire n'est pas disponible."
      operationId: emprunter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpruntRequest"
        required: true
      responses:
        "201":
          description: "Emprunt enregistré, avec sa date d'échéance"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmpruntDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /emprunts/{empruntId}/retour:
    post:
      tags:
      - Emprunts
      summary: "Rendre un exemplaire (F6, F7)"
      description: "Sans corps, la date de retour est celle du jour. Un retour aprè\
        s l'échéance crée une pénalité de 100 XOF par jour de retard."
      operationId: rendre
      parameters:
      - name: empruntId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetourRequest"
      responses:
        "200":
          description: Retour enregistré ; la pénalité est absente si l'exemplaire
            est rendu à temps
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RetourDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /adherents:
    post:
      tags:
      - Adhérents
      summary: "S'inscrire comme adhérent, étudiant ou enseignant (F3)"
      description: Le quota d'emprunts simultanés est de 3 pour un étudiant et de
        5 pour un enseignant.
      operationId: inscrire
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscriptionRequest"
        required: true
      responses:
        "201":
          description: Adhérent inscrit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdherentDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /situations/{adherentId}:
    get:
      tags:
      - Emprunts
      summary: Consulter ses emprunts en cours et ses pénalités (F9)
      operationId: situation
      parameters:
      - name: adherentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Les emprunts en cours et toutes les pénalités de l'adhérent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SituationAdherentDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /livres/{livreId}:
    get:
      tags:
      - Catalogue
      summary: Consulter un livre et l'état de ses exemplaires
      operationId: trouverLivre
      parameters:
      - name: livreId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "Le livre, avec le nombre d'exemplaires disponibles"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LivreDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /emprunts/{empruntId}:
    get:
      tags:
      - Emprunts
      summary: Consulter un emprunt
      operationId: trouver
      parameters:
      - name: empruntId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: L'emprunt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmpruntDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /adherents/{adherentId}:
    get:
      tags:
      - Adhérents
      summary: Consulter un adhérent
      operationId: trouver_1
      parameters:
      - name: adherentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: L'adhérent et son quota d'emprunts
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdherentDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /exemplaires/{exemplaireId}:
    delete:
      tags:
      - Catalogue
      summary: Retirer un exemplaire abîmé (F2)
      description: "Un exemplaire en cours d'emprunt ne peut pas être retiré : il\
        \ doit d'abord être rendu."
      operationId: retirerExemplaire
      parameters:
      - name: exemplaireId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Exemplaire retiré du catalogue
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
components:
  schemas:
    ProblemDetail:
      type: object
      description: "Erreur au format Problem Details (RFC 9457), sans détail interne."
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Emprunt refusé
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: "L'adhérent a une pénalité de retard impayée : il doit d'abord\
            \ la payer avant de pouvoir emprunter de nouveau."
        instance:
          type: string
          example: /emprunts
        erreurs:
          type: array
          description: "Présent pour les erreurs de validation : un élément par champ\
            \ fautif."
          items:
            $ref: "#/components/schemas/ErreurChamp"
        traceId:
          type: string
          description: "Présent pour les erreurs 500 et 503 : identifiant à communiquer\
            \ à l'équipe technique."
          example: 3f9a1c2e
    ErreurChamp:
      type: object
      properties:
        champ:
          type: string
          example: titre
        message:
          type: string
          example: Le titre du livre est obligatoire.
    PenaliteDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        adherentId:
          type: string
          format: uuid
        empruntId:
          type: string
          format: uuid
        joursDeRetard:
          type: integer
          format: int32
        montantXof:
          type: integer
          format: int32
        statut:
          type: string
          enum:
          - IMPAYEE
          - PAYEE
    AjouterLivreRequest:
      type: object
      properties:
        titre:
          type: string
          maxLength: 255
          minLength: 0
        auteur:
          type: string
          maxLength: 255
          minLength: 0
        nombreExemplaires:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      required:
      - auteur
      - nombreExemplaires
      - titre
    ExemplaireDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        livreId:
          type: string
          format: uuid
        etat:
          type: string
          enum:
          - DISPONIBLE
          - EMPRUNTE
          - RETIRE
    LivreDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titre:
          type: string
        auteur:
          type: string
        exemplairesDisponibles:
          type: integer
          format: int32
        exemplaires:
          type: array
          items:
            $ref: "#/components/schemas/ExemplaireDto"
    EmpruntRequest:
      type: object
      properties:
        adherentId:
          type: string
          format: uuid
        exemplaireId:
          type: string
          format: uuid
      required:
      - adherentId
      - exemplaireId
    EmpruntDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        adherentId:
          type: string
          format: uuid
        exemplaireId:
          type: string
          format: uuid
        dateEmprunt:
          type: string
          format: date
        dateEcheance:
          type: string
          format: date
        dateRetour:
          type: string
          format: date
    RetourRequest:
      type: object
      properties:
        dateRetour:
          type: string
          format: date
    RetourDto:
      type: object
      properties:
        emprunt:
          $ref: "#/components/schemas/EmpruntDto"
        joursDeRetard:
          type: integer
          format: int32
        penalite:
          $ref: "#/components/schemas/PenaliteDto"
    InscriptionRequest:
      type: object
      properties:
        nom:
          type: string
          maxLength: 255
          minLength: 0
        type:
          type: string
          enum:
          - ETUDIANT
          - ENSEIGNANT
      required:
      - nom
      - type
    AdherentDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        type:
          type: string
          enum:
          - ETUDIANT
          - ENSEIGNANT
        quotaEmprunts:
          type: integer
          format: int32
    SituationAdherentDto:
      type: object
      properties:
        adherentId:
          type: string
          format: uuid
        empruntsEnCours:
          type: array
          items:
            $ref: "#/components/schemas/EmpruntDto"
        penalites:
          type: array
          items:
            $ref: "#/components/schemas/PenaliteDto"
  responses:
    RequeteInvalide:
      description: "Requête invalide : corps absent ou illisible, champ manquant ou\
        \ incorrect, identifiant mal formé. Le détail dit quel champ corriger ; `erreurs`\
        \ liste chaque champ fautif."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Introuvable:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflit:
      description: "Règle du métier refusée (quota, pénalité impayée, exemplaire indisponible...)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ErreurInterne:
      description: Erreur inattendue du serveur. Le détail contient un identifiant
        de suivi (`traceId`) à communiquer à l'équipe technique.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceIndisponible:
      description: "Base de données momentanément indisponible : réessayer dans quelques\
        \ instants (en-tête Retry-After)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
