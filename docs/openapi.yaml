openapi: 3.1.0
info:
  title: SunuBiblio
  description: "Prêts de la bibliothèque universitaire : livres et exemplaires, adhé\
    rents, emprunts, retours et pénalités de retard. Toutes les erreurs suivent le\
    \ format Problem Details (RFC 9457), avec un message en français explicite."
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Serveur local
tags:
- name: Catalogue
  description: "Livres et exemplaires (F1, F2, F4)"
- name: Adhérents
  description: Inscription des étudiants et des enseignants (F3)
- name: Pénalités
  description: "Paiement et consultation des pénalités de retard (F8, F9)"
- name: Prêts
  description: "Emprunts, restitutions et emprunts en cours (F5, F6, F7, F9)"
paths:
  /api/prets:
    get:
      tags:
      - Prêts
      summary: Consulter les emprunts en cours d'un adhérent (F9)
      operationId: getEmpruntsEnCours
      parameters:
      - name: adherentId
        in: query
        description: Identifiant de l'adhérent
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Les emprunts non rendus de l'adhérent, du plus ancien au plus\
            \ récent"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmpruntDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
    post:
      tags:
      - Prêts
      summary: Emprunter un exemplaire (F5)
      description: "Le prêt dure 14 jours. Refusé si l'adhérent a atteint son quota,\
        \ s'il a une pénalité impayée ou si l'exemplaire n'est pas disponible."
      operationId: emprunter
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpruntRequest"
        required: true
      responses:
        "201":
          description: "Emprunt enregistré, avec sa date d'échéance"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmpruntDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/prets/{empruntId}/restitution:
    post:
      tags:
      - Prêts
      summary: "Rendre un exemplaire (F6, F7)"
      description: "Sans corps, la date de retour est celle du jour. Un retour aprè\
        s l'échéance crée une pénalité de 100 XOF par jour de retard."
      operationId: restituer
      parameters:
      - name: empruntId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestitutionRequest"
      responses:
        "200":
          description: Restitution enregistrée ; la pénalité est absente si l'exemplaire
            est rendu à temps
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RestitutionDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/penalites/{id}/payer:
    post:
      tags:
      - Pénalités
      summary: Payer une pénalité (F8)
      description: "Une fois toutes ses pénalités réglées, l'adhérent peut de nouveau\
        \ emprunter."
      operationId: payerPenalite
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Pénalité réglée
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/catalogue/livres:
    get:
      tags:
      - Catalogue
      summary: Lister ou rechercher les livres et voir les exemplaires disponibles
        (F4)
      operationId: listerLivres
      parameters:
      - name: q
        in: query
        description: "Texte cherché dans le titre, l'auteur ou l'ISBN, sans tenir\
          \ compte des majuscules"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "Les livres dont le titre, l'auteur ou l'ISBN contient le texte\
            \ (tous sans texte)"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LivreDto"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
    post:
      tags:
      - Catalogue
      summary: Ajouter un livre et ses exemplaires (F1)
      description: "Si l'ISBN est déjà au catalogue, les nouveaux exemplaires sont\
        \ ajoutés à ce livre (son titre et son auteur ne changent pas)."
      operationId: ajouterLivre
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjouterLivreRequest"
        required: true
      responses:
        "201":
          description: "Exemplaires créés, tous disponibles"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LivreDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/adherents:
    post:
      tags:
      - Adhérents
      summary: "S'inscrire comme adhérent, étudiant ou enseignant (F3)"
      description: Le quota d'emprunts simultanés est de 3 pour un étudiant et de
        5 pour un enseignant.
      operationId: inscrire
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscriptionRequest"
        required: true
      responses:
        "201":
          description: Adhérent inscrit
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdherentDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/prets/{empruntId}:
    get:
      tags:
      - Prêts
      summary: Consulter un emprunt
      operationId: trouver
      parameters:
      - name: empruntId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: L'emprunt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmpruntDto"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/penalites:
    get:
      tags:
      - Pénalités
      summary: Consulter les pénalités d'un adhérent (F9)
      operationId: getPenalitesAdherent
      parameters:
      - name: adherentId
        in: query
        description: Identifiant de l'adhérent
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "Toutes les pénalités de l'adhérent, des plus anciennes aux\
            \ plus récentes"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PenaliteDto"
        "400":
          $ref: "#/components/responses/RequeteInvalide"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/catalogue/livres/{isbn}:
    get:
      tags:
      - Catalogue
      summary: Consulter un livre et l'état de ses exemplaires
      operationId: getLivre
      parameters:
      - name: isbn
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Le livre et ses exemplaires
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LivreDto"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/adherents/{adherentId}:
    get:
      tags:
      - Adhérents
      summary: "Consulter un adhérent, son quota et son éventuel blocage"
      operationId: trouver_1
      parameters:
      - name: adherentId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: L'adhérent
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdherentDto"
        "404":
          $ref: "#/components/responses/Introuvable"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
  /api/catalogue/exemplaires/{exemplaireId}:
    delete:
      tags:
      - Catalogue
      summary: Retirer un exemplaire abîmé (F2)
      description: "Un exemplaire en cours d'emprunt ne peut pas être retiré : il\
        \ doit d'abord être rendu."
      operationId: retirerExemplaire
      parameters:
      - name: exemplaireId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Exemplaire retiré du catalogue
        "404":
          $ref: "#/components/responses/Introuvable"
        "409":
          $ref: "#/components/responses/Conflit"
        "500":
          $ref: "#/components/responses/ErreurInterne"
        "503":
          $ref: "#/components/responses/ServiceIndisponible"
components:
  schemas:
    ProblemDetail:
      type: object
      description: "Erreur au format Problem Details (RFC 9457), sans détail interne."
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Emprunt refusé
        status:
          type: integer
          format: int32
          example: 409
        detail:
          type: string
          example: "L'adhérent a une pénalité de retard impayée : il doit d'abord\
            \ la payer avant de pouvoir emprunter de nouveau."
        instance:
          type: string
          example: /emprunts
        erreurs:
          type: array
          description: "Présent pour les erreurs de validation : un élément par champ\
            \ fautif."
          items:
            $ref: "#/components/schemas/ErreurChamp"
        traceId:
          type: string
          description: "Présent pour les erreurs 500 et 503 : identifiant à communiquer\
            \ à l'équipe technique."
          example: 3f9a1c2e
    ErreurChamp:
      type: object
      properties:
        champ:
          type: string
          example: titre
        message:
          type: string
          example: Le titre du livre est obligatoire.
    EmpruntRequest:
      type: object
      properties:
        adherentId:
          type: string
          minLength: 1
        exemplaireId:
          type: string
          minLength: 1
      required:
      - adherentId
      - exemplaireId
    EmpruntDto:
      type: object
      properties:
        id:
          type: string
        adherentId:
          type: string
        exemplaireId:
          type: string
        dateEmprunt:
          type: string
          format: date
        dateEcheance:
          type: string
          format: date
        dateRetour:
          type: string
          format: date
        statut:
          type: string
          enum:
          - EN_COURS
          - RESTITUE
    RestitutionRequest:
      type: object
      properties:
        dateRetour:
          type: string
          format: date
    PenaliteDto:
      type: object
      properties:
        id:
          type: string
        adherentId:
          type: string
        exemplaireId:
          type: string
        joursDeRetard:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
        statut:
          type: string
          enum:
          - IMPAYEE
          - REGLEE
        dateCreation:
          type: string
          format: date-time
    RestitutionDto:
      type: object
      properties:
        emprunt:
          $ref: "#/components/schemas/EmpruntDto"
        joursDeRetard:
          type: integer
          format: int32
        penalite:
          $ref: "#/components/schemas/PenaliteDto"
    AjouterLivreRequest:
      type: object
      properties:
        isbn:
          type: string
          maxLength: 32
          minLength: 0
          pattern: "[0-9A-Za-z-]*"
        titre:
          type: string
          maxLength: 255
          minLength: 0
        auteur:
          type: string
          maxLength: 255
          minLength: 0
        nombreExemplaires:
          type: integer
          format: int32
          maximum: 500
          minimum: 1
      required:
      - auteur
      - isbn
      - nombreExemplaires
      - titre
    ExemplaireDto:
      type: object
      properties:
        id:
          type: string
        livreIsbn:
          type: string
        statut:
          type: string
          enum:
          - DISPONIBLE
          - EMPRUNTE
          - RETIRE
    LivreDto:
      type: object
      properties:
        isbn:
          type: string
        titre:
          type: string
        auteur:
          type: string
        exemplaires:
          type: array
          items:
            $ref: "#/components/schemas/ExemplaireDto"
    InscriptionRequest:
      type: object
      properties:
        nom:
          type: string
          maxLength: 255
          minLength: 0
        type:
          type: string
          enum:
          - ETUDIANT
          - ENSEIGNANT
      required:
      - nom
      - type
    AdherentDto:
      type: object
      properties:
        id:
          type: string
        nom:
          type: string
        type:
          type: string
          enum:
          - ETUDIANT
          - ENSEIGNANT
        quotaEmprunts:
          type: integer
          format: int32
        estBloquePourImpayes:
          type: boolean
        montantImpaye:
          type: integer
          format: int64
  responses:
    RequeteInvalide:
      description: "Requête invalide : corps absent ou illisible, champ manquant ou\
        \ incorrect, identifiant mal formé. Le détail dit quel champ corriger ; `erreurs`\
        \ liste chaque champ fautif."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Introuvable:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflit:
      description: "Règle du métier refusée (quota, pénalité impayée, exemplaire indisponible...)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ErreurInterne:
      description: Erreur inattendue du serveur. Le détail contient un identifiant
        de suivi (`traceId`) à communiquer à l'équipe technique.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    ServiceIndisponible:
      description: "Base de données momentanément indisponible : réessayer dans quelques\
        \ instants (en-tête Retry-After)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
